name: Mini-app checks
on:
  push:
    branches-ignore: [deploy]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Playwright 1.51.1 supports Ubuntu 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:deploy
      - run: npm run build:deploy
      - run: npm test
        env:
          MINI_APP_ROOT: dist
      - run: npm run test:inventory
        env:
          MINI_APP_ROOT: dist
      - run: npm run test:weather
        env:
          MINI_APP_ROOT: dist
      - run: npm run test:ocr
        env:
          MINI_APP_ROOT: dist
