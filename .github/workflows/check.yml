name: Mini-app checks
on:
  push:
    branches-ignore: [deploy]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Playwright 1.51.1 supports Ubuntu 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:deploy
      - run: npm run build:deploy
      - run: npm test
        env:
          MINI_APP_ROOT: dist
      - run: npm run test:inventory
        env:
          MINI_APP_ROOT: dist
      - run: npm run test:weather
        env:
          MINI_APP_ROOT: dist
      - run: npm run test:news
        env:
          MINI_APP_ROOT: dist
      - run: npm run test:ocr
        env:
          MINI_APP_ROOT: dist
  news-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: News API unit and HTTP boundary tests
        run: python -m unittest discover -s services/news/tests -p 'test_*.py' -v
      - name: Real FreshRSS with isolated HTTPS RSS fixture
        run: python services/news/tests/integration.py
